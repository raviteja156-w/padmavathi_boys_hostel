{% extends 'base.html' %}
{% block title %}Payments — Padmavathi Boys hostel{% endblock %}
{% block content %}

<div class="max-w-md mx-auto animate-slide-up">
  <div class="text-center mb-6">
    <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-primary/10 text-primary text-2xl mb-3">
      <i class="fa-solid fa-qrcode"></i>
    </div>
    <h1 class="text-2xl sm:text-3xl font-bold text-slate-800">Payments</h1>
    <p class="text-slate-500 text-sm mt-1">Enter your registered mobile number to see your payment details.</p>
  </div>

  <form method="POST" action="{{ url_for('payments_lookup') }}" class="card p-5 sm:p-7 space-y-5">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div>
      <label class="form-label"><i class="fa-solid fa-phone mr-1.5 text-primary"></i>Your Mobile Number</label>
      <input type="tel" name="contact" id="contact" required pattern="[6-9][0-9]{9}" maxlength="10"
             placeholder="10-digit mobile number" class="form-input" inputmode="numeric" autofocus>
      <p class="text-xs text-slate-400 mt-1">The same number your room was registered with.</p>
    </div>

    <button type="submit" class="btn-primary w-full text-base py-4 flex items-center justify-center gap-2">
      <i class="fa-solid fa-arrow-right"></i> Continue
    </button>
  </form>
</div>

{% endblock %}

{% block extra_scripts %}
<script>
document.getElementById('contact').addEventListener('input', function () {
  this.value = this.value.replace(/\D/g, '').slice(0, 10);
});
</script>
{% endblock %}
