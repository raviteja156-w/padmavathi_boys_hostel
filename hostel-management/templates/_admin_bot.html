<!-- ADMIN BOT: floating chat helper (Check Vacancy / Make Empty / Per-day Rent / AI Assistant with voice) -->
<style>
  .bot-fab { position: fixed; right: 1rem; bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); z-index: 46;
    width: 3.5rem; height: 3.5rem; border-radius: 9999px; display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem; color: #fff; background: linear-gradient(135deg, #7C3AED, #4F46E5 60%, #2563EB); box-shadow: 0 6px 18px rgba(79,70,229,.45); animation: botGlow 2.8s ease-in-out infinite; }
  @keyframes botGlow { 0%,100% { box-shadow: 0 0 0 0 rgba(124,58,237,.5), 0 6px 18px rgba(79,70,229,.45); } 50% { box-shadow: 0 0 0 10px rgba(124,58,237,0), 0 8px 22px rgba(79,70,229,.55); } }
  @media (prefers-reduced-motion: reduce) { .bot-fab { animation: none; } }
  @media (max-width: 640px) { .bot-fab { bottom: calc(5.25rem + env(safe-area-inset-bottom, 0px)); } }
  .bot-panel { position: fixed; right: 1rem; bottom: calc(5rem + env(safe-area-inset-bottom, 0px)); z-index: 60;
    width: min(26rem, calc(100vw - 2rem)); height: min(34rem, calc(100vh - 7rem)); display: none; flex-direction: column;
    background: #fff; border: 1px solid #DBEAFE; border-radius: 1.1rem; box-shadow: 0 20px 50px rgba(15,23,42,.28); overflow: hidden; }
  .bot-panel.open { display: flex; }
  @media (max-width: 640px) { .bot-panel { right: .5rem; left: .5rem; width: auto; bottom: calc(.5rem + env(safe-area-inset-bottom, 0px)); height: calc(100vh - 1.5rem); height: calc(100dvh - 1.5rem); } }
  .bot-head { background: linear-gradient(135deg, #6D28D9, #4F46E5 60%, #2563EB); color: #fff; padding: .75rem 1rem; display: flex; align-items: center; gap: .6rem; }
  .bot-head h3 { font-weight: 700; flex: 1; }
  .bot-head button { color: #dbeafe; width: 2rem; height: 2rem; }
  .bot-body { flex: 1; overflow-y: auto; padding: .9rem; background: #F8FAFC; display: flex; flex-direction: column; gap: .55rem; }
  .bot-msg { max-width: 92%; padding: .55rem .8rem; border-radius: .9rem; font-size: .9rem; line-height: 1.35; overflow-wrap: anywhere; }
  .bot-msg.bot { background: #fff; border: 1px solid #E2E8F0; align-self: flex-start; border-bottom-left-radius: .25rem; }
  .bot-msg.me { background: #1E3A8A; color: #fff; align-self: flex-end; border-bottom-right-radius: .25rem; }
  .bot-chips { display: flex; flex-wrap: wrap; gap: .4rem; align-self: flex-start; max-width: 100%; }
  .bot-chip { background: #fff; border: 1.5px solid #BFDBFE; color: #1E3A8A; font-weight: 600; font-size: .85rem;
    padding: .5rem .8rem; border-radius: .8rem; min-height: 40px; text-align: left; }
  .bot-chip:hover { background: #EFF6FF; }
  .bot-chip.danger { border-color: #FECACA; color: #B91C1C; }
  .bot-chip.primary { background: #1E3A8A; color: #fff; border-color: #1E3A8A; }
  .bot-chips.used .bot-chip { opacity: .45; pointer-events: none; }
  .bot-foot { border-top: 1px solid #E2E8F0; padding: .6rem; display: flex; gap: .5rem; background: #fff; }
  .bot-foot input { flex: 1; font-size: 16px; border: 1.5px solid #CBD5E1; border-radius: .7rem; padding: .5rem .7rem; min-width: 0; }
  .bot-foot input:disabled { background: #F1F5F9; }
  .bot-foot button { background: #1E3A8A; color: #fff; border-radius: .7rem; padding: 0 .9rem; font-weight: 600; }
  .bot-foot button:disabled { opacity: .5; }
  .bot-table { width: 100%; border-collapse: collapse; font-size: .8rem; margin-top: .3rem; }
  .bot-table th, .bot-table td { padding: .25rem .35rem; border-bottom: 1px solid #E2E8F0; text-align: left; }
  .bot-table th { color: #475569; font-weight: 600; }
  .bot-table td.n, .bot-table th.n { text-align: center; }
  .bot-pill { display: inline-block; font-weight: 700; padding: 0 .4rem; border-radius: 9999px; font-size: .75rem; }
  .bot-head button.on { color: #fff; background: rgba(255,255,255,.2); border-radius: .5rem; }
  .bot-head .bot-lang { width: auto; padding: 0 .45rem; font-weight: 700; font-size: .75rem; border: 1px solid rgba(219,234,254,.5); border-radius: .5rem; height: 1.7rem; }
  .bot-foot .bot-mic { background: #fff; color: #1E3A8A; border: 1.5px solid #BFDBFE; padding: 0 .75rem; }
  .bot-foot .bot-mic.rec { background: #DC2626; color: #fff; border-color: #DC2626; animation: botPulse 1s infinite; }
  @keyframes botPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(220,38,38,.5); } 50% { box-shadow: 0 0 0 6px rgba(220,38,38,0); } }
  .bot-pill.free { background: #DCFCE7; color: #166534; } .bot-pill.full { background: #FEE2E2; color: #991B1B; } .bot-pill.na { background: #F1F5F9; color: #64748B; }
</style>

<button type="button" id="botFab" class="bot-fab" aria-label="Open AI Assistant" title="AI Assistant — Ask AI"><i class="fa-solid fa-robot"></i></button>

<div id="botPanel" class="bot-panel" role="dialog" aria-label="Admin assistant" data-csrf="{{ csrf_token() }}">
  <div class="bot-head">
    <i class="fa-solid fa-robot text-lg"></i>
    <h3>AI Assistant</h3>
    <button type="button" id="botLang" class="bot-lang" title="Speaking language: English">EN</button>
    <button type="button" id="botSpeak" title="Read replies aloud" aria-label="Read replies aloud" aria-pressed="false"><i class="fa-solid fa-volume-xmark"></i></button>
    <button type="button" id="botRestart" title="Start over" aria-label="Start over"><i class="fa-solid fa-rotate-left"></i></button>
    <button type="button" id="botClose" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <div id="botBody" class="bot-body"></div>
  <form id="botForm" class="bot-foot" autocomplete="off">
    <input id="botInput" type="text" inputmode="text" placeholder="Pick an option above…" disabled>
    <button type="button" id="botMic" class="bot-mic" title="Speak a command" aria-label="Speak a command" disabled><i class="fa-solid fa-microphone"></i></button>
    <button type="submit" id="botSend" disabled><i class="fa-solid fa-paper-plane"></i></button>
  </form>
</div>

<script src="{{ url_for('static', filename='js/admin_bot.js') }}"></script>
