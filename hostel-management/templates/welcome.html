{% extends 'base.html' %}
{% block title %}Welcome — Padmavathi Boys hostel{% endblock %}
{% block content %}

<div class="max-w-md mx-auto animate-slide-up text-center py-6 sm:py-12">
  <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-primary/10 text-primary text-3xl mb-4">
    <i class="fa-solid fa-building-shield"></i>
  </div>
  <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-800 mb-2">Welcome</h1>
  <p class="text-slate-500 mb-1">Padmavathi Boys hostel</p>
  <p class="text-slate-700 font-semibold text-lg mt-5 mb-6">Please login into Payments Dashboard</p>

  <a href="{{ url_for('payments_lookup') }}" class="btn-primary w-full text-base py-4 flex items-center justify-center gap-2">
    <i class="fa-solid fa-qrcode"></i> Go to Payments Dashboard
  </a>
  <p class="text-xs text-slate-400 mt-4">Use the mobile number your room was registered with.</p>
</div>

{% endblock %}
