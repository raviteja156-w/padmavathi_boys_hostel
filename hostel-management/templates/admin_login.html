{% extends 'base.html' %}
{% block title %}Admin Login — Hostel Management System{% endblock %}
{% block content %}

<div class="max-w-sm mx-auto mt-6 sm:mt-14 animate-slide-up">
  <div class="text-center mb-6">
    <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-primary/10 text-primary text-3xl mb-3">
      <i class="fa-solid fa-user-shield"></i>
    </div>
    <h1 class="text-2xl font-bold text-slate-800">Admin Login</h1>
    <p class="text-slate-500 text-sm mt-1">Enter your credentials to manage the hostel.</p>
  </div>

  <form method="POST" action="{{ url_for('admin_login') }}" class="card p-6 sm:p-7 space-y-5">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div>
      <label class="form-label"><i class="fa-solid fa-user mr-1.5 text-primary"></i>Username</label>
      <input type="text" name="username" required autofocus autocomplete="username" class="form-input">
    </div>

    <div>
      <label class="form-label"><i class="fa-solid fa-lock mr-1.5 text-primary"></i>Password</label>
      <input type="password" name="password" required autocomplete="current-password" class="form-input">
    </div>

    <button type="submit" class="btn-primary w-full text-base py-3.5 flex items-center justify-center gap-2">
      <i class="fa-solid fa-right-to-bracket"></i> LOGIN
    </button>
  </form>
</div>

{% endblock %}
