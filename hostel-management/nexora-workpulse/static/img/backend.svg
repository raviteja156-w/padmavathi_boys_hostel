<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
<defs><linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
<linearGradient id="b" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#10b981"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="10"/></filter></defs>
<style>.l{animation:b 1.2s steps(2) infinite}.l2{animation-delay:-.4s}.l3{animation-delay:-.8s}@keyframes b{50%{opacity:.2}}
.pk{animation:m 2.2s linear infinite}.pk2{animation-delay:-1.1s}@keyframes m{from{transform:translateX(0);opacity:0}15%{opacity:1}85%{opacity:1}to{transform:translateX(110px);opacity:0}}
.fl{animation:f 5s ease-in-out infinite}@keyframes f{50%{transform:translateY(-8px)}}
.gear{transform-origin:256px 64px;animation:s 6s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style>
<circle cx="140" cy="130" r="90" fill="url(#a)" opacity=".25" filter="url(#g)"/>
<g class="fl">
<rect x="60" y="48" width="130" height="44" rx="12" fill="#161a40" stroke="url(#a)" stroke-width="2"/>
<rect x="60" y="102" width="130" height="44" rx="12" fill="#161a40" stroke="url(#a)" stroke-width="2"/>
<rect x="60" y="156" width="130" height="44" rx="12" fill="#161a40" stroke="url(#a)" stroke-width="2"/>
<g fill="#10b981"><circle class="l" cx="80" cy="70" r="5"/><circle class="l l2" cx="80" cy="124" r="5"/><circle class="l l3" cx="80" cy="178" r="5"/></g>
<g fill="#f59e0b"><circle class="l l3" cx="96" cy="70" r="5"/><circle class="l" cx="96" cy="124" r="5"/><circle class="l l2" cx="96" cy="178" r="5"/></g>
<g fill="#ffffff26"><rect x="116" y="66" width="56" height="8" rx="4"/><rect x="116" y="120" width="56" height="8" rx="4"/><rect x="116" y="174" width="56" height="8" rx="4"/></g>
</g>
<path d="M196 124h100" stroke="#ffffff1f" stroke-width="3" stroke-dasharray="4 6"/>
<rect class="pk" x="192" y="118" width="16" height="12" rx="3" fill="url(#b)"/><rect class="pk pk2" x="192" y="118" width="16" height="12" rx="3" fill="#ec4899"/>
<g class="gear"><circle cx="256" cy="64" r="18" stroke="#c4b5fd" stroke-width="6" stroke-dasharray="6 5"/><circle cx="256" cy="64" r="7" fill="#c4b5fd"/></g>
<text x="250" y="206" font-family="monospace" font-size="15" fill="#22d3ee">{ api }</text>
</svg>
