<style>.fl{animation:f 5s ease-in-out infinite}@keyframes f{50%{transform:translateY(-8px)}}
.blk{transform-box:fill-box;transform-origin:left;animation:w 3s ease-in-out infinite}.b2{animation-delay:-1s}.b3{animation-delay:-2s}@keyframes w{0%,100%{transform:scaleX(.6)}50%{transform:scaleX(1)}}
.cur{animation:c 4s ease-in-out infinite}@keyframes c{0%,100%{transform:translate(0,0)}40%{transform:translate(-70px,-40px)}70%{transform:translate(-20px,-70px)}}
.sp{animation:t 2s ease-in-out infinite}@keyframes t{50%{transform:scale(.6);opacity:.4}}</style>
