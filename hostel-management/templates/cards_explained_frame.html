<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Tel;src:url('/static/fonts/noto-sans-telugu-telugu-400-normal.woff2');font-weight:400}
@font-face{font-family:Tel;src:url('/static/fonts/noto-sans-telugu-telugu-700-normal.woff2');font-weight:700}
@font-face{font-family:Tel;src:url('/static/fonts/noto-sans-telugu-telugu-800-normal.woff2');font-weight:800}
@font-face{font-family:Num;src:url('/static/fonts/inter-latin-400-normal.woff2');font-weight:400}
@font-face{font-family:Num;src:url('/static/fonts/inter-latin-700-normal.woff2');font-weight:700}
@font-face{font-family:Num;src:url('/static/fonts/inter-latin-800-normal.woff2');font-weight:800}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#020617;margin:0}
body{font-family:Num,Tel,sans-serif;color:#fff}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;
  background:radial-gradient(1200px 700px at 15% 10%,#1e3a8a 0%,rgba(30,58,138,0) 60%),radial-gradient(900px 600px at 90% 90%,#4c1d95 0%,rgba(76,29,149,0) 60%),#071330}
.t{font-family:Tel,Num,sans-serif}
.n{font-family:Num,Tel,sans-serif;font-variant-numeric:tabular-nums}
.abs{position:absolute}
.title{font-size:64px;font-weight:800;line-height:1.25}
.sub{font-size:34px;color:#cbd5e1;font-weight:400;line-height:1.5}
.card{border-radius:28px;padding:30px 36px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.14)}
.lbl{font-size:30px;color:#cbd5e1}
.big{font-size:72px;font-weight:800}
.rent{color:#60A5FA}.paid{color:#4ADE80}.bal{color:#F87171}
.chip{position:absolute;border-radius:18px;padding:10px 14px;background:#12224d;border:2px solid rgba(255,255,255,.18);text-align:center}
.chip .r{font-size:22px;color:#cbd5e1}.chip .v{font-size:30px;font-weight:800}
.node{position:absolute;border-radius:24px;padding:16px 26px;text-align:center;border:3px solid;background-color:#12224d!important}
.cap{position:absolute;left:0;right:0;bottom:56px;text-align:center}
.cap span{display:inline-block;background:rgba(2,6,23,.78);border:2px solid rgba(255,255,255,.15);border-radius:20px;padding:16px 34px;font-size:40px;font-weight:700;font-family:Tel,Num,sans-serif;max-width:1700px;line-height:1.45}
.row{position:absolute;display:flex;align-items:center;gap:22px}
.stu{width:300px;border-radius:22px;padding:18px 22px;background:rgba(255,255,255,.09);border:2px solid rgba(255,255,255,.18)}
.stu .nm{font-size:30px;font-weight:700}.stu .v{font-size:40px;font-weight:800}
.tag{display:inline-block;border-radius:999px;padding:6px 18px;font-size:26px;font-weight:700}
svg{position:absolute;left:0;top:0}

#bar{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;padding:8px 12px;background:rgba(2,6,23,.92);font-family:Num,Tel,sans-serif;z-index:5}
#bar button{width:42px;height:42px;border-radius:12px;border:0;background:#1E293B;color:#fff;font-size:18px;cursor:pointer;flex-shrink:0}
#bar button.main{background:#2563EB}
#prog{flex:1;height:10px;border-radius:6px;background:#1E293B;position:relative;cursor:pointer}
#prog i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,#3B82F6,#22C55E);width:0}
#prog b{position:absolute;top:-3px;width:2px;height:16px;background:#64748B}
#lab{color:#CBD5E1;font-size:13px;min-width:64px;text-align:right}
</style></head>
<body><div id="stage"></div>
<div id="bar"><button type="button" id="bPrev" aria-label="Previous scene">⏮</button><button type="button" class="main" id="bPlay" aria-label="Play or pause">⏸</button><button type="button" id="bNext" aria-label="Next scene">⏭</button><div id="prog"><i></i></div><span id="lab"></span></div>
<script type="application/json" id="cxData">{{ {'rooms': rooms, 'today': today}|tojson }}</script>
<script>(function(){ var d = JSON.parse(document.getElementById('cxData').textContent); window.ROOMS = d.rooms; window.TODAY_LABEL = d.today; })();</script>
{% raw %}
<script>
const R = window.ROOMS;
const W = 1920, H = 1080;
const fmt = n => '₹' + Math.round(n).toLocaleString('en-IN');
const clamp = (x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease = x => { x = clamp(x); return x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2; };
const p = (t,s,d)=> ease((t-s)/d);          // progress of an animation that starts at s and lasts d seconds
const op = (t,s,d=0.5)=> p(t,s,d);
const pop = (t,s)=>{ const k=p(t,s,.45); return `opacity:${k};transform:translateY(${(1-k)*40}px) scale(${.92+.08*k})`; };
const fadeOut = (t,dur)=> 1 - p(t, dur-0.6, 0.6);
const cap = (t,s,txt,e)=> `<div class="cap" style="opacity:${op(t,s)*(e!==undefined?1-p(t,e,.4):1)}"><span>${txt}</span></div>`;
const sum = (arr,i)=>arr.reduce((a,b)=>a+b[i],0);

const OLD = Object.entries(R['Old Hostel']), NEW = Object.entries(R['New Hostel']);
const roomTot = (st,i)=>sum(st,i);
const T = {
  rent: sum(OLD.flatMap(r=>r[1]),1)+sum(NEW.flatMap(r=>r[1]),1),
  paid: sum(OLD.flatMap(r=>r[1]),2)+sum(NEW.flatMap(r=>r[1]),2),
  bal:  sum(OLD.flatMap(r=>r[1]),3)+sum(NEW.flatMap(r=>r[1]),3),
};
const H_OLD = {rent: sum(OLD.flatMap(r=>r[1]),1), paid: sum(OLD.flatMap(r=>r[1]),2), bal: sum(OLD.flatMap(r=>r[1]),3)};
const H_NEW = {rent: sum(NEW.flatMap(r=>r[1]),1), paid: sum(NEW.flatMap(r=>r[1]),2), bal: sum(NEW.flatMap(r=>r[1]),3)};
const count = (t,s,d,v)=> fmt(v*p(t,s,d));

// ---------- SCENES ----------
const SCENES = [
// 1. Title + the three cards
{ dur: 8, draw(t){
  const cards = [['మొత్తం అద్దె','Total Rent','rent',T.rent],['చెల్లించినది','Total Paid','paid',T.paid],['బాకీ','Balance Due','bal',T.bal]];
  return `
  <div class="abs t" style="left:0;right:0;top:150px;text-align:center;${pop(t,.2)}">
    <div class="title">డ్యాష్‌బోర్డ్ కార్డులు ఎలా వస్తాయి?</div>
    <div class="sub" style="margin-top:14px">విద్యార్థి నుండి మొత్తం వరకు — మొదటి నుండి చివరి వరకు చూద్దాం</div>
  </div>
  ${cards.map((c,i)=>`<div class="card abs" style="left:${150+i*560}px;top:470px;width:500px;${pop(t,1.2+i*.35)}">
     <div class="lbl t">${c[0]} <span style="opacity:.6">• ${c[1]}</span></div>
     <div class="big n ${c[2]}" style="margin-top:12px">${count(t,1.4+i*.35,1.6,c[3])}</div></div>`).join('')}
  <div class="abs t" style="left:0;right:0;top:760px;text-align:center;font-size:30px;color:#94a3b8;opacity:${op(t,3)}">ఈ రోజు (${window.TODAY_LABEL}) యాప్ లెక్కలు</div>
  ${cap(t,4.2,'ఈ మూడు సంఖ్యలు ఎక్కడ నుండి వచ్చాయో ఇప్పుడు ఒక్కొక్కటిగా చూద్దాం')}`;
}},
// 2. The tree idea: student -> room -> hostel -> total
{ dur: 9, draw(t){
  const lv = [['విద్యార్థి','ప్రతి విద్యార్థి అద్దె','#A78BFA',730],['గది','గదిలోని అందరి కూడిక','#60A5FA',545],['హాస్టల్','అన్ని గదుల కూడిక','#F59E0B',360],['మొత్తం','రెండు హాస్టళ్ల కూడిక','#4ADE80',175]];
  let svg = `<svg width="${W}" height="${H}">`;
  for (let i=0;i<3;i++){ const k=p(t,1+i*1.1,.8); const y1=lv[i][3], y2=lv[i+1][3]+90;
    svg += `<line x1="960" y1="${y1}" x2="960" y2="${y1-(y1-y2)*k}" stroke="${lv[i+1][2]}" stroke-width="8" stroke-linecap="round"/>`; }
  svg += '</svg>';
  return svg + lv.map((l,i)=>`<div class="node t" style="left:610px;width:700px;top:${l[3]}px;border-color:${l[2]};background:rgba(255,255,255,.06);${pop(t,.4+i*1.1)}">
      <div style="font-size:48px;font-weight:800;color:${l[2]}">${i+1}. ${l[0]}</div><div style="font-size:30px;color:#cbd5e1">${l[1]}</div></div>`).join('')
    + `<div class="abs t" style="left:90px;top:120px;font-size:52px;font-weight:800;${pop(t,.1)}">వేరు నుండి చెట్టు పైకి 🌳</div>`
    + cap(t,5,'ప్రతి కార్డు ఇలానే వస్తుంది: విద్యార్థి → గది → హాస్టల్ → మొత్తం');
}},
// 3. One room up close: Old Hostel Room 1
{ dur: 11, draw(t){
  const EX = pickRoom(); const st = EX.students;
  const gap = 1380 / st.length, x0 = 960 - gap * (st.length - 1) / 2;
  const tot = roomTot(st,1);
  let svg = `<svg width="${W}" height="${H}">`;
  st.forEach((s,i)=>{ const x=x0+i*gap; const k=p(t,3.2+i*.3,.8);
    svg += `<path d="M${x} 520 C ${x} 600, 960 600, 960 ${520+(170)*k}" stroke="#60A5FA" stroke-width="6" fill="none" opacity="${k}"/>`; });
  svg += '</svg>';
  return svg + `<div class="abs t" style="left:90px;top:110px;${pop(t,.1)}"><div style="font-size:52px;font-weight:800">ఉదాహరణ: ${EX.hostelTe} • ${EX.roomTe}</div>
      <div class="sub">${st.length} మంది విద్యార్థులు — ఒక్కొక్కరి అద్దె</div></div>`
   + st.map((s,i)=>`<div class="stu abs" style="left:${x0+i*gap-150}px;top:330px;${pop(t,.8+i*.5)}"><div class="nm">${s[0]}</div><div class="v n rent">${fmt(s[1])}</div></div>`).join('')
   + `<div class="node" style="left:660px;width:600px;top:700px;border-color:#60A5FA;background:rgba(59,130,246,.15);${pop(t,4.2)}">
        <div class="t" style="font-size:32px;color:#cbd5e1">${EX.roomTe} మొత్తం అద్దె</div>
        <div class="n" style="font-size:36px;color:#cbd5e1;margin-top:6px">${st.map(s=>fmt(s[1])).join(' + ')}</div>
        <div class="n rent" style="font-size:64px;font-weight:800">= ${count(t,4.6,1.4,tot)}</div></div>`
   + cap(t,6.5,'ఒక గదిలో ఉన్న అందరి అద్దెలు కలిపితే → ఆ గది మొత్తం');
}},
// 4. Rooms -> hostels -> TOTAL RENT
{ dur: 14, draw(t){ return treeScene(t,'rent','మొత్తం అద్దె (Total Rent)','#60A5FA',
   'అన్ని గదుల అద్దెలు కలిపితే హాస్టల్ మొత్తం; రెండు హాస్టళ్లు కలిపితే → మొత్తం అద్దె'); }},
// 5. TOTAL PAID with the rule
{ dur: 16, draw(t){
  const tree = treeScene(t,'paid','చెల్లించినది (Total Paid)','#4ADE80','ప్రతి విద్యార్థి ఈ అద్దె నెలకు కట్టిన డబ్బు కలిపితే → చెల్లించినది', 9.5);
  const k = p(t,9.6,.5), out = 1;
  const rule = `<div class="abs" style="left:0;top:0;width:${W}px;height:${H}px;background:rgba(7,19,48,${.97*k});opacity:${k}">
     <div class="abs t" style="left:150px;top:140px;width:1620px">
       <div style="font-size:54px;font-weight:800;color:#4ADE80">ఏ డబ్బు "చెల్లించినది" లో వస్తుంది?</div>
       <div style="font-size:38px;line-height:1.7;margin-top:24px">
         ✅ విద్యార్థి <b>జాయిన్ అయిన రోజే</b> ప్రతి నెలా అద్దె రోజు.<br>
         ✅ ఆ రోజు నుండి కట్టిన డబ్బు → ఈ నెల అద్దెకి.<br>
         ⏪ ఆ రోజుకి <b>ముందు</b> కట్టిన డబ్బు → గత నెల అద్దెకి.</div>
       <div class="card" style="margin-top:34px;${pop(t,11.4)}">
         <div style="font-size:36px;line-height:1.6">ఉదా: ఒక విద్యార్థి 30 సెప్టెంబర్ న జాయిన్ అయ్యాడు, 3 అక్టోబర్ న ₹7,000 కట్టాడు.<br>
         ఆ డబ్బు 30 సెప్టెంబర్ – 29 అక్టోబర్ నెలకి. <span style="color:#F87171;font-weight:800">30 అక్టోబర్ న మళ్లీ బాకీ.</span></div></div>
     </div></div>`;
  return tree + (t>9.5 ? rule : '');
}},
// 6. BALANCE DUE + the Akshaj example
{ dur: 16, draw(t){
  const tree = treeScene(t,'bal','బాకీ (Balance Due)','#F87171','ప్రతి విద్యార్థి: అద్దె − కట్టినది. అందరి బాకీ కలిపితే → మొత్తం బాకీ', 9);
  const k = p(t,9.1,.5);
  const OVER = overpaid(); const extra = OVER.reduce((a,s)=>a+s.extra,0);
  const left = OVER.length ? `<div class="card" style="flex:1;${pop(t,9.8)}"><div style="font-size:34px">${OVER[0].name} (${OVER[0].where})</div>
          <div class="n" style="font-size:40px;margin-top:10px">అద్దె ${fmt(OVER[0].rent)} • కట్టినది ${fmt(OVER[0].paid)}</div>
          <div style="font-size:36px;margin-top:10px">బాకీ = <b class="n bal">₹0</b> (−${fmt(OVER[0].extra).slice(1)} కాదు)</div>
          ${OVER.length > 1 ? `<div style="font-size:28px;margin-top:8px;color:#cbd5e1">ఇలా మొత్తం ${OVER.length} మంది అదనంగా కట్టారు</div>` : ''}</div>`
    : `<div class="card" style="flex:1;${pop(t,9.8)}"><div style="font-size:36px;line-height:1.6">ఈ రోజు ఎవరూ అద్దె కంటే ఎక్కువ కట్టలేదు ✅<br>అందుకే లెక్క నేరుగా సరిపోతుంది.</div></div>`;
  const right = `<div class="card" style="flex:1;${pop(t,11)}"><div style="font-size:34px">అందుకే:</div>
          <div class="n" style="font-size:38px;margin-top:10px">${fmt(T.rent)} − ${fmt(T.paid)} = ${fmt(T.rent - T.paid)}</div>
          ${extra > 0 ? `<div class="n" style="font-size:38px;margin-top:6px">${fmt(T.rent - T.paid)} + ${fmt(extra)} (అదనం) = <b class="bal">${fmt(T.bal)}</b></div>`
                      : `<div class="n" style="font-size:38px;margin-top:6px">= బాకీ <b class="bal">${fmt(T.bal)}</b></div>`}</div>`;
  const ex = `<div class="abs" style="left:0;top:0;width:${W}px;height:${H}px;background:rgba(7,19,48,${.97*k});opacity:${k}">
    <div class="abs t" style="left:150px;top:110px;width:1620px">
      <div style="font-size:52px;font-weight:800;color:#F87171">బాకీ ఎప్పుడూ ₹0 కంటే తక్కువ కాదు</div>
      <div style="display:flex;gap:30px;margin-top:34px">${left}${right}</div>
      <div style="font-size:36px;margin-top:34px;color:#cbd5e1;${pop(t,12.4)}">ఒకరు అదనంగా కట్టిన డబ్బు ఇంకొకరి బాకీ తీర్చదు. అందుకే బాకీని విద్యార్థి వారీగా లెక్కిస్తాం.</div>
    </div></div>`;
  return tree + (t>9 ? ex : '');
}},
// 7. What happens next: the due-day timeline
{ dur: 13, draw(t){
  const pts = [['29 అక్టో','రేపు జాబితా','#F59E0B','"Tomorrow" లో కనిపిస్తాడు'],['30 అక్టో','బాకీ జాబితా','#F87171','అద్దె రోజు → Due List'],['కట్టిన రోజు','చెల్లించాడు','#4ADE80','Due List నుండి తొలగిపోతాడు'],['30 నవం','మళ్లీ','#60A5FA','ప్రతి నెలా ఇదే']];
  const k = p(t,1,6);
  let s = `<svg width="${W}" height="${H}"><line x1="220" y1="560" x2="${220+1480*k}" y2="560" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/></svg>`;
  s += `<div class="abs t" style="left:90px;top:110px;${pop(t,.1)}"><div style="font-size:52px;font-weight:800">ఇక ముందు ఏమి జరుగుతుంది?</div>
        <div class="sub">ఉదా: 30వ తేదీన జాయిన్ అయిన విద్యార్థి (30 అక్టోబర్ 2026 నుండి ఈ నియమం)</div></div>`;
  pts.forEach((q,i)=>{ const x=220+i*493; const s0=1+i*1.5;
    s += `<div class="abs" style="left:${x-34}px;top:526px;width:68px;height:68px;border-radius:50%;background:${q[2]};${pop(t,s0)}"></div>
          <div class="abs t" style="left:${x-200}px;top:380px;width:400px;text-align:center;${pop(t,s0+.2)}"><div style="font-size:40px;font-weight:800;color:${q[2]}">${q[0]}</div></div>
          <div class="abs t" style="left:${x-210}px;top:630px;width:420px;text-align:center;${pop(t,s0+.4)}"><div class="tag" style="background:${q[2]};color:#0b1220">${q[1]}</div>
            <div style="font-size:30px;color:#e2e8f0;margin-top:14px">${q[3]}</div></div>`; });
  return s + cap(t,8,'నెల మారినప్పుడు కాదు — ప్రతి విద్యార్థి తన జాయిన్ తేదీన మళ్లీ బాకీ అవుతాడు');
}},
// 8. Summary
{ dur: 9, draw(t){
  const rows = [['మొత్తం అద్దె','అందరి అద్దెలు కూడిక','rent'],['చెల్లించినది','ఈ అద్దె నెలకు కట్టినవి కూడిక','paid'],['బాకీ','ప్రతి విద్యార్థి (అద్దె − కట్టినది), ₹0 కంటే తక్కువ కాదు','bal']];
  return `<div class="abs t" style="left:0;right:0;top:120px;text-align:center;${pop(t,.1)}"><div class="title">గుర్తుంచుకోండి</div></div>`
   + rows.map((r,i)=>`<div class="card abs t" style="left:260px;width:1400px;top:${300+i*190}px;display:flex;justify-content:space-between;align-items:center;${pop(t,.8+i*.6)}">
       <div style="font-size:46px;font-weight:800" class="${r[2]}">${r[0]}</div><div style="font-size:34px;color:#e2e8f0">${r[1]}</div></div>`).join('')
   + cap(t,3.6,'ఏ కార్డు మీద నొక్కినా → గది వారీగా పూర్తి లెక్క కనిపిస్తుంది');
}},
];

// Shared tree: 21 rooms -> 2 hostels -> total, for rent / paid / bal
function treeScene(t, key, title, color, caption, capEnd){
  const idx = {rent:1, paid:2, bal:3}[key];
  const all = [...OLD.map(r=>['Old Hostel',...r]), ...NEW.map(r=>['New Hostel',...r])];
  const colW = 86, top = 720;
  let svg = `<svg width="${W}" height="${H}">`;
  let chips = '';
  const hx = {'Old Hostel': 520, 'New Hostel': 1400};
  all.forEach((r,i)=>{
    const old = r[0]==='Old Hostel';
    const j = old ? i : i - OLD.length;
    const n = old ? OLD.length : NEW.length;
    const span = old ? 820 : 900;
    const x0 = old ? 120 : 960;
    const x = x0 + j*(span/(n)) + span/n/2;
    const s0 = .6 + i*.12;
    const v = roomTot(r[2], idx);
    const lk = p(t, 2.9 + (old?0:.4), 1.2);
    svg += `<line x1="${x}" y1="${top}" x2="${x + (hx[r[0]]-x)*lk}" y2="${top - (top-542)*lk}" stroke="${color}" stroke-width="3" opacity="${.55*lk}"/>`;
    chips += `<div class="chip" style="left:${x-40}px;top:${top}px;width:80px;padding:8px 2px;${pop(t,s0)};${v>0?`border-color:${color}`:''}">
       <div class="r t" style="font-size:15px">${r[1].replace('Room ','రూమ్ ').replace('Hall','హాల్')}</div>
       <div class="v n" style="font-size:19px;color:${v>0?color:'#94a3b8'}">${(v/1000).toFixed(v%1000?1:0)}K</div></div>`;
  });
  const HO = {'Old Hostel': [H_OLD[key],'ఓల్డ్ హాస్టల్'], 'New Hostel': [H_NEW[key],'న్యూ హాస్టల్']};
  Object.entries(hx).forEach(([h,x])=>{
    const k = p(t, 5.2, 1);
    svg += `<line x1="${x}" y1="400" x2="${x + (960-x)*k}" y2="${400 - (400-367)*k}" stroke="${color}" stroke-width="6" opacity="${k}"/>`;
  });
  svg += '</svg>';
  const hostels = Object.entries(hx).map(([h,x],i)=>`<div class="node" style="left:${x-220}px;width:440px;top:400px;border-color:${color};background:rgba(255,255,255,.07);${pop(t,4.1+i*.3)}">
      <div class="t" style="font-size:32px;color:#e2e8f0">${HO[h][1]}</div><div class="n" style="font-size:52px;font-weight:800;color:${color}">${count(t,4.3+i*.3,1.3,HO[h][0])}</div></div>`).join('');
  const total = `<div class="node" style="left:560px;width:800px;top:150px;border-color:${color};background:rgba(255,255,255,.1);box-shadow:0 0 ${60*p(t,6.6,1)}px ${color};${pop(t,6.2)}">
      <div class="t" style="font-size:36px;color:#e2e8f0">${title}</div>
      <div class="n" style="font-size:30px;color:#cbd5e1">${fmt(HO['Old Hostel'][0])} + ${fmt(HO['New Hostel'][0])}</div>
      <div class="n" style="font-size:76px;font-weight:800;color:${color}">= ${count(t,6.4,1.4,HO['Old Hostel'][0]+HO['New Hostel'][0])}</div></div>`;
  const legend = `<div class="abs t" style="left:120px;top:${top+110}px;font-size:26px;color:#94a3b8;${pop(t,1.6)}">↑ 21 గదులు (ఓల్డ్ 10 + న్యూ 10 + హాల్) — ప్రతి గది మొత్తం</div>`;
  return svg + chips + legend + hostels + total + cap(t, 7.6, caption, capEnd);
}

const HOSTEL_TE = {'Old Hostel': 'ఓల్డ్ హాస్టల్', 'New Hostel': 'న్యూ హాస్టల్'};
const roomTe = l => l.replace('Room ', 'రూమ్ ').replace('Hall', 'హాల్');
function pickRoom(){
  for (const want of [3, 2, 4]) for (const h of ['Old Hostel','New Hostel']) for (const [l, st] of Object.entries(R[h] || {}))
    if (st.length === want) return {hostelTe: HOSTEL_TE[h], roomTe: roomTe(l), students: st};
  for (const h of ['Old Hostel','New Hostel']) for (const [l, st] of Object.entries(R[h] || {}))
    if (st.length) return {hostelTe: HOSTEL_TE[h], roomTe: roomTe(l), students: st.slice(0, 4)};
  return {hostelTe: '', roomTe: '', students: []};
}
function overpaid(){
  const out = [];
  for (const h of ['Old Hostel','New Hostel']) for (const [l, st] of Object.entries(R[h] || {}))
    for (const s of st) if (s[2] > s[1] + 0.5) out.push({name: s[0], where: HOSTEL_TE[h] + ' ' + roomTe(l), rent: s[1], paid: s[2], extra: s[2] - s[1]});
  return out.sort((a,b)=>b.extra-a.extra);
}
window.SCENES = SCENES;
window.drawScene = function(i, t){
  const sc = SCENES[i];
  const fo = clamp(1 - Math.max(0, t - (sc.dur - .5)) / .5);
  const fi = clamp(t / .4);
  document.getElementById('stage').innerHTML = `<div style="position:absolute;inset:0;opacity:${Math.min(fo,fi)}">${sc.draw(t)}</div>`;
};

/* ---------- player ---------- */
(function(){
  const durs = SCENES.map(s => s.dur), total = durs.reduce((a,b)=>a+b,0);
  const starts = durs.map((d,i)=>durs.slice(0,i).reduce((a,b)=>a+b,0));
  let pos = 0, playing = true, lastTs = null, lastFrame = -1;
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const prog = document.getElementById('prog'), bar = prog.querySelector('i'), lab = document.getElementById('lab'), play = document.getElementById('bPlay');
  starts.slice(1).forEach(s => { const b = document.createElement('b'); b.style.left = (s/total*100)+'%'; prog.appendChild(b); });
  function fit(){
    const bh = document.getElementById('bar').offsetHeight;
    const k = Math.min(innerWidth/1920, (innerHeight-bh)/1080);
    const st = document.getElementById('stage');
    st.style.transform = `scale(${k})`;
    st.style.left = ((innerWidth - 1920*k)/2) + 'px';
    st.style.top = Math.max(0, (innerHeight - bh - 1080*k)/2) + 'px';
  }
  function show(){
    let i = 0; while (i < durs.length-1 && pos >= starts[i+1]) i++;
    const t = Math.min(pos - starts[i], durs[i] - 0.001);
    const frame = Math.round(pos*30);
    if (frame !== lastFrame) { drawScene(i, t); lastFrame = frame; }
    bar.style.width = (pos/total*100)+'%';
    lab.textContent = `${i+1}/${durs.length} • ${Math.floor(pos/60)}:${String(Math.floor(pos%60)).padStart(2,'0')}`;
    return i;
  }
  function tick(ts){
    if (playing) {
      if (lastTs !== null) pos += Math.min(0.1, (ts-lastTs)/1000);
      if (pos >= total) { pos = total - 0.001; playing = false; play.textContent = '↻'; }
    }
    lastTs = ts; show(); requestAnimationFrame(tick);
  }
  function jump(i){ i = Math.max(0, Math.min(durs.length-1, i)); pos = starts[i] + (reduce ? durs[i]-0.7 : 0); lastFrame = -1; }
  play.onclick = () => { if (!playing && pos >= total-0.01) pos = 0; playing = !playing; play.textContent = playing ? '⏸' : '▶'; };
  document.getElementById('bPrev').onclick = () => { const i = show(); jump(pos - starts[i] > 1.5 ? i : i-1); };
  document.getElementById('bNext').onclick = () => { jump(show()+1); };
  prog.onclick = e => { const r = prog.getBoundingClientRect(); pos = Math.max(0, Math.min(total-0.01, (e.clientX-r.left)/r.width*total)); lastFrame = -1; };
  document.addEventListener('keydown', e => { if (e.key===' ') { e.preventDefault(); play.click(); } if (e.key==='ArrowRight') document.getElementById('bNext').click(); if (e.key==='ArrowLeft') document.getElementById('bPrev').click(); });
  document.addEventListener('visibilitychange', () => { lastTs = null; });
  addEventListener('resize', fit);
  if (reduce) { playing = false; play.textContent = '▶'; pos = durs[0]-0.7; }
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { fit(); requestAnimationFrame(tick); });
  fit();
})();
</script>{% endraw %}</body></html>
