<style>.c{animation:fall 3s linear infinite}.c:nth-of-type(2n){animation-duration:3.6s}.c:nth-of-type(3n){animation-duration:2.6s;animation-delay:-1s}.c:nth-of-type(5n){animation-delay:-2s}
