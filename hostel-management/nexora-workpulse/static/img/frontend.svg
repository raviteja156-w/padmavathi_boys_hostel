<g fill="#fbbf24"><path class="sp" d="M280 52l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/><path class="sp" style="animation-delay:-1s" d="M30 170l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></g>
