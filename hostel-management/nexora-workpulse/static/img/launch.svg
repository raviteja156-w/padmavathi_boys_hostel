<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" fill="none">
<defs>
<linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset=".55" stop-color="#ec4899"/><stop offset="1" stop-color="#f97316"/></linearGradient>
<linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
<linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fde047"/><stop offset=".5" stop-color="#f97316"/><stop offset="1" stop-color="#f43f5e" stop-opacity="0"/></linearGradient>
<linearGradient id="w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c1f4a"/><stop offset="1" stop-color="#11132f"/></linearGradient>
<filter id="g"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<style>
.orb{transform-origin:210px 170px;animation:spin 18s linear infinite}.orb2{animation-duration:26s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.rk{animation:up 3.2s ease-in-out infinite}@keyframes up{50%{transform:translateY(-14px)}}
.flame{transform-origin:210px 196px;animation:fl .18s linear infinite alternate}@keyframes fl{to{transform:scaleY(1.35) scaleX(.9)}}
.st{animation:tw 2.4s ease-in-out infinite}.st:nth-of-type(2){animation-delay:-.8s}.st:nth-of-type(3){animation-delay:-1.6s}@keyframes tw{50%{opacity:.15}}
.bar{transform-box:fill-box;transform-origin:left;animation:ld 2.8s ease-in-out infinite}@keyframes ld{0%{transform:scaleX(.2)}60%,100%{transform:scaleX(1)}}
.pl{animation:pl 6s ease-in-out infinite}@keyframes pl{50%{transform:translate(6px,-6px)}}
</style>
<circle cx="210" cy="170" r="120" fill="url(#a)" opacity=".25" filter="url(#g)"/>
<g class="orb"><ellipse cx="210" cy="170" rx="160" ry="60" stroke="#ffffff1c" stroke-width="2" transform="rotate(-18 210 170)"/><circle cx="352" cy="124" r="8" fill="#22d3ee"/></g>
<g class="orb orb2"><ellipse cx="210" cy="170" rx="130" ry="44" stroke="#ffffff14" stroke-width="2" transform="rotate(22 210 170)"/><circle cx="92" cy="128" r="6" fill="#ec4899"/></g>
<rect x="110" y="214" width="200" height="104" rx="16" fill="url(#w)" stroke="#ffffff26"/>
<path d="M110 238h200" stroke="#ffffff1f"/><circle cx="126" cy="226" r="4" fill="#f43f5e"/><circle cx="140" cy="226" r="4" fill="#f59e0b"/><circle cx="154" cy="226" r="4" fill="#10b981"/>
<rect x="170" y="221" width="120" height="10" rx="5" fill="#ffffff14"/>
<rect x="128" y="254" width="164" height="10" rx="5" fill="#ffffff12"/><rect class="bar" x="128" y="254" width="164" height="10" rx="5" fill="url(#b)"/>
<rect x="128" y="276" width="70" height="26" rx="8" fill="url(#a)"/><rect x="208" y="276" width="84" height="26" rx="8" fill="#ffffff12"/>
<g class="rk">
<path class="flame" d="M198 196c0 22 12 40 12 40s12-18 12-40z" fill="url(#fl)"/>
<path d="M210 60c26 22 32 70 22 136h-44c-10-66-4-114 22-136z" fill="url(#a)"/>
<circle cx="210" cy="118" r="13" fill="#11132f" stroke="#fff" stroke-width="4"/>
<path d="M188 166l-22 30h24zM232 166l22 30h-24z" fill="url(#b)"/>
</g>
<g fill="#fff"><circle class="st" cx="60" cy="60" r="2.5"/><circle class="st" cx="370" cy="40" r="2"/><circle class="st" cx="380" cy="250" r="2.5"/></g>
<g class="pl"><circle cx="62" cy="250" r="20" fill="url(#b)" opacity=".85"/><ellipse cx="62" cy="250" rx="32" ry="8" stroke="#ffffff55" stroke-width="2"/></g>
</svg>
