<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
<defs><linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ec4899"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
